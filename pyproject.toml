[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ed-fast-telemetry"
version = "0.1.0.dev0"
description = "Standalone fast planetary telemetry for Elite Dangerous on Windows"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = ["PySide6==6.11.2"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-qt==4.5.0", "pyinstaller==6.22.2"]

[project.scripts]
ed-fast-telemetry = "ed_fast_telemetry.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
pythonpath = ["src"]
